<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanmakuChat</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/danmaku.css">
    <link href="js/modules/twitch/module.css" rel="stylesheet">
    <link href="js/modules/youtube/module.css" rel="stylesheet">
    <link href="js/modules/tiktok/module.css" rel="stylesheet">
    <link href="js/modules/kick/module.css" rel="stylesheet">
    <link href="js/modules/streamelements/module.css" rel="stylesheet">
    <link href="js/modules/streamlabs/module.css" rel="stylesheet">
    <link href="js/modules/patreon/module.css" rel="stylesheet">
    <link href="js/modules/tipeeestream/module.css" rel="stylesheet">
    <link href="js/modules/kofi/module.css" rel="stylesheet">
    <link href="js/modules/fourthwall/module.css" rel="stylesheet">
</head>
<body>
    <div id="danmaku-layer"></div>

    <!-- Core (loads immediately, no CDN dependency) -->
    <script src="js/sb.js"></script>
    <script src="js/danmaku.js"></script>

    <!-- CDN Enhancement (async, non-blocking) -->
    <script>
    (function() {
        var dompurify = document.createElement('script');
        dompurify.src = 'https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js';
        dompurify.onerror = function() { console.warn('[DanmakuChat] DOMPurify CDN failed to load'); };
        document.head.appendChild(dompurify);

        var sbClient = document.createElement('script');
        sbClient.src = 'https://cdn.jsdelivr.net/npm/@streamerbot/client@1.12.1/dist/streamerbot-client.min.js';
        sbClient.onerror = function() { console.warn('[DanmakuChat] Streamer.bot client CDN failed to load'); };
        sbClient.onload = function() {
            if (typeof streamerBotConnect === 'function') {
                try { streamerBotClient = streamerBotConnect(); } catch(e) {
                    console.warn('[DanmakuChat] Delayed SB connect failed:', e);
                }
                // Re-register platform handlers now that client is available
                if (typeof registerAllPlatformHandlers === 'function') {
                    registerAllPlatformHandlers();
                }
            }
        };
        document.head.appendChild(sbClient);
    })();
    </script>

    <!-- Platform Modules -->
    <script src="js/modules/twitch/module.js"></script>
    <script src="js/modules/youtube/module.js"></script>
    <script src="js/modules/tiktok/module.js"></script>
    <script src="js/modules/kick/module.js"></script>
    <script src="js/modules/streamelements/module.js"></script>
    <script src="js/modules/streamlabs/module.js"></script>
    <script src="js/modules/patreon/module.js"></script>
    <script src="js/modules/tipeeestream/module.js"></script>
    <script src="js/modules/kofi/module.js"></script>
    <script src="js/modules/fourthwall/module.js"></script>
</body>
</html>
