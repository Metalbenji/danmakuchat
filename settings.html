<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DanmakuChat - Settings</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/css/all.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <h1>DanmakuChat</h1>
      <span class="subtitle">Multi-Platform Danmaku Overlay</span>
    </div>
    <div class="header-right">
      <button id="btn-reset" class="btn btn-secondary" title="Reset all settings to defaults">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        <span class="btn-text">Reset</span>
      </button>
      <button id="btn-export" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        <span class="btn-text">Copy OBS URL</span>
      </button>
    </div>
  </header>

  <!-- Mobile Toggle Button -->
  <button class="mobile-toggle" onclick="toggleMobilePanel()" aria-label="Toggle Settings">
    <i class="fa-solid fa-sliders"></i>
    <span class="btn-text">Settings</span>
  </button>

  <div id="main-content">

    <!-- Settings Panel -->
    <aside id="settings-panel">
      <div class="panel-scroll" id="panel-scroll">
        <!-- All sections are generated by JS below -->
      </div>
    </aside>

    <!-- Preview Panel -->
    <main id="preview-panel">
      <div id="preview-toolbar">
        <div class="preview-status" id="preview-status">
          <span class="status-dot active"></span>
          <span>Live Preview</span>
        </div>
        <div class="preview-controls">
          <label class="control-label">Size:</label>
          <select id="preview-size">
            <option value="1920x1080">1920 x 1080</option>
            <option value="1280x720" selected>1280 x 720</option>
            <option value="960x540">960 x 540</option>
            <option value="854x480">854 x 480</option>
          </select>
          <button id="btn-pause-demo" class="btn btn-sm btn-secondary">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            Pause
          </button>
          <button id="btn-burst" class="btn btn-sm btn-secondary" title="Send a burst of demo messages">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M13 2.05v2.02c3.95.49 7 3.85 7 7.93 0 4.08-3.05 7.44-7 7.93v2.02c5.05-.5 9-4.76 9-9.95 0-5.19-3.95-9.45-9-9.95zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7v4l5-5-5-5v4c-5.52 0-10 4.48-10 10s4.48 10 10 10v-4z"/></svg>
            Burst
          </button>
        </div>
      </div>

      <div id="preview-container">
        <!-- iframe(s) are created dynamically by settings.js -->
        <!-- Layer indicators overlaid on preview -->
        <div id="layer-indicators">
          <div class="layer-indicator" data-layer="front">
            <span class="indicator-dot active" id="ind-front"></span>
            <span>Front</span>
            <span class="indicator-tag events">Events + Rare</span>
          </div>
          <div class="layer-indicator" data-layer="middle">
            <span class="indicator-dot active" id="ind-middle"></span>
            <span>Middle</span>
            <span class="indicator-tag normal">Standard</span>
          </div>
          <div class="layer-indicator" data-layer="back">
            <span class="indicator-dot active" id="ind-back"></span>
            <span>Back</span>
            <span class="indicator-tag blur">Blur</span>
          </div>
        </div>
      </div>
    </main>

  </div>
</div>

<script src="js/settings.js"></script>
</body>
</html>
